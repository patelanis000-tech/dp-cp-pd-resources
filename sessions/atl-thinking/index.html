<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>DP/CP Professional Development — Approaches to Learning</title>
<link rel="stylesheet" href="style-base.css">
<link rel="stylesheet" href="style-slides.css">
</head>
<body>
<div class="deck" id="deck"></div>
<a class="home-link" href="https://dp-cp-pd-resources.pages.dev/">PD home</a>
<div class="nav"><button id="prev" aria-label="Previous slide">←</button><button id="next" aria-label="Next slide">→</button></div>
<div class="counter" id="counter"></div><div class="progress" id="progress"></div>
<script>
Promise.all(['slides-1.html','slides-2.html','slides-3.html'].map(file=>fetch(file).then(r=>r.text()))).then(parts=>{
  document.getElementById('deck').innerHTML=parts.join('\n');
  const slides=[...document.querySelectorAll('.slide')];let index=0;
  function show(i){index=Math.max(0,Math.min(slides.length-1,i));slides.forEach((s,j)=>s.classList.toggle('active',j===index));document.getElementById('progress').style.width=((index+1)/slides.length*100)+'%';document.getElementById('counter').textContent=(index+1)+' / '+slides.length;}
  document.getElementById('prev').addEventListener('click',()=>show(index-1));
  document.getElementById('next').addEventListener('click',()=>show(index+1));
  document.addEventListener('keydown',e=>{if(['ArrowRight','PageDown',' '].includes(e.key)){e.preventDefault();show(index+1)}else if(['ArrowLeft','PageUp'].includes(e.key)){e.preventDefault();show(index-1)}else if(e.key==='Home')show(0);else if(e.key==='End')show(slides.length-1)});
  show(0);
});
</script>
</body>
</html>
